# Builds this repo's Markdown into static pages and deploys them to GitHub Pages,
# with the shared CSI Microscopy workflow (csi-Microscopy.github.io/tools/build-docs),
# pinned to its release tag v1.
# Needs Settings → Pages → Source: "GitHub Actions"; until then the deploy job
# fails and the site keeps being served from the branch as before.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * 1'   # weekly, so a new release of the shared build (the v1 tag moved) reaches this site

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: CSI-Microscopy/csi-Microscopy.github.io/.github/workflows/build-instrument-site.yml@v1
    with:
      repo: Luxendo-MuVi-SPIM-Light-Sheet
      branch: master        # deploy only from master
      site: site.json
